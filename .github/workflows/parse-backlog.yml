# Parses whatever is currently unparsed, by claiming it from Turso.
#
# There is no work assignment here on purpose. Runners are not told which replays to take - each
# one claims its own with an atomic UPDATE ... RETURNING that stamps a lease, so two runners can
# never get the same replay and a runner that dies just lets its lease lapse. That means the count
# below is a throughput dial, not a partition: 4 runners and 20 runners both parse the same backlog
# correctly, one just finishes sooner.
#
# The worker lives in the private replay-worker repo and is checked out here rather than vendored,
# so it can't drift from what the VPS runs.

name: Parse backlog

on:
  workflow_dispatch:
    inputs:
      runners:
        description: 'Parallel runners (1-20)'
        required: false
        default: '4'
      window_id:
        description: 'Restrict to one window_id (blank = any unparsed replay)'
        required: false
        default: ''
      worker_ref:
        description: 'Branch of replay-worker to run (test a branch before merging it to main)'
        required: false
        default: 'main'
  repository_dispatch:
    types: [parse_burst]

# Let bursts overlap - leases make that safe - by giving every run its own group.
#
# A shared group does NOT do that, even with cancel-in-progress off. GitHub holds at most one
# running plus one pending run per group and cancels whatever pending run a newer dispatch
# supersedes, so with runs living up to 350 minutes and the dispatcher polling every 30, a single
# long run pinned burst capacity at whatever that first run happened to ask for and every later
# dispatch was cancelled without ever starting a job. `cancel-in-progress: false` only ever
# protected the run already going; it never let a second one alongside it.
#
# Keying on run_id means no run is ever queued behind or cancelled by another, which is what the
# lease model already made safe: overlapping runners cannot claim the same replay.
concurrency:
  group: parse-backlog-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      window_id: ${{ steps.plan.outputs.window_id }}
    steps:
      - id: plan
        run: |
          RUNNERS="${{ github.event.inputs.runners || github.event.client_payload.runners || '4' }}"
          WINDOW="${{ github.event.inputs.window_id || github.event.client_payload.window_id || '' }}"

          # Free-plan concurrency tops out at 20; asking for more just queues jobs behind each other.
          [ "$RUNNERS" -gt 20 ] 2>/dev/null && RUNNERS=20
          [ "$RUNNERS" -lt 1 ] 2>/dev/null && RUNNERS=1

          echo "shards=$(seq 1 "$RUNNERS" | jq -Rsc 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"
          echo "window_id=$WINDOW" >> "$GITHUB_OUTPUT"
          echo "→ $RUNNERS runner(s), window='${WINDOW:-any}'"

  parse:
    needs: plan
    runs-on: ubuntu-latest
    # Hard cap is 360. Staying under it matters: BUDGET_MINUTES below must leave enough room for
    # an in-flight parse to finish, or the runner is killed mid-parse and those replays sit claimed
    # until their lease expires.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}

    steps:
      - name: Verify worker repo credential
        # actions/checkout cannot report a bad credential usefully: git drops the rejected auth
        # header and falls back to prompting, so an expired or revoked WORKER_REPO_TOKEN surfaces
        # as "could not read Username for 'https://github.com'" three times over ~30s and says
        # nothing about the token. PATs expire on their own schedule, so this is a recurring
        # failure, not a one-off. Check the token first and name the actual problem.
        env:
          WORKER_REPO_TOKEN: ${{ secrets.WORKER_REPO_TOKEN }}
        run: |
          if [ -z "$WORKER_REPO_TOKEN" ]; then
            echo "::error::WORKER_REPO_TOKEN is not set on this repository. Add a PAT with read access to theauthenticator/replay-worker."
            exit 1
          fi
          CODE=$(curl -sS -o /dev/null -w '%{http_code}'             -H "Authorization: Bearer $WORKER_REPO_TOKEN"             -H "Accept: application/vnd.github+json"             https://api.github.com/repos/theauthenticator/replay-worker)
          case "$CODE" in
            200) echo "✓ WORKER_REPO_TOKEN can read replay-worker" ;;
            401) echo "::error::WORKER_REPO_TOKEN is expired or revoked (401). Rotate the PAT and update the WORKER_REPO_TOKEN secret."; exit 1 ;;
            403) echo "::error::WORKER_REPO_TOKEN is rejected (403) - SSO authorization or rate limit. Re-authorize the PAT for the org."; exit 1 ;;
            404) echo "::error::WORKER_REPO_TOKEN cannot see theauthenticator/replay-worker (404). It needs Contents: read on that private repo."; exit 1 ;;
            *)   echo "::error::Unexpected $CODE from the GitHub API while checking WORKER_REPO_TOKEN."; exit 1 ;;
          esac

      - name: Check out worker source
        uses: actions/checkout@v4
        with:
          repository: theauthenticator/replay-worker
          token: ${{ secrets.WORKER_REPO_TOKEN }}
          # Defaults to main, which carries the pull worker. Override to prove a branch before
          # merging it.
          #
          # Note what this ref actually decides: pull-worker.js runs ONLY here, never on the VPS
          # (no pm2 entry references it), so `npm run deploy` in replay-worker does not reach it.
          # A pull-worker change is live for burst parsing only once it is pushed to this ref.
          ref: ${{ github.event.inputs.worker_ref || github.event.client_payload.worker_ref || 'main' }}

      - name: Drop committed secrets from the checkout
        # replay-worker tracks .env / .npmrc. Config comes from Actions secrets instead, so the
        # checked-out copies are removed before anything can read them.
        run: rm -f .env .env.production .npmrc

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild libsql bindings for linux
        # node_modules is committed, which is why there is no npm install here - the parser and its
        # ffi-napi linux-x64 prebuild come with the checkout. @libsql/client is the exception: its
        # bindings are platform-specific and the committed copy is built for the dev machine.
        run: npm install @libsql/client --force --no-save 2>&1 | tail -3

      - name: Stage Oodle libraries at the working directory
        # liblinoodle is a PE loader and resolves oo2core_8_win64.dll relative to the CWD, not to
        # its own location. The VPS has copies sitting at the repo root from some past manual step,
        # which is the only reason it works there - they are not in git. Without this a fresh
        # checkout aborts with `what(): Failed to parse PE` before a single replay is parsed.
        run: |
          cp node_modules/@theauthenticator/fortnite-replay-parser/oo2core_8_win64.dll . 2>/dev/null || true
          cp node_modules/@theauthenticator/fortnite-replay-parser/liblinoodle.so . 2>/dev/null || true
          ls -la oo2core_8_win64.dll liblinoodle.so

      - name: Parse
        env:
          WORKER_ID: gha-${{ github.run_id }}-${{ matrix.shard }}
          PARSE_CONCURRENCY: '4'
          WINDOW_ID: ${{ needs.plan.outputs.window_id }}
          BUDGET_MINUTES: '320'
          IDLE_EXIT_SECONDS: '120'
          LEASE_MINUTES: '15'
          PARSE_TIMEOUT_MINUTES: '10'
          RETRY_STATUS: READY_FOR_DOWNLOAD_VPS1
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_DYNAMODB_REGION: ${{ secrets.AWS_DYNAMODB_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          DYNAMO_TABLE: ${{ secrets.DYNAMO_TABLE }}
        # The exit code is not a usable success signal here. The native replay parser holds worker
        # threads that never exit and cannot be terminated without faulting inside the addon, so the
        # process dies with an access violation during teardown - after every replay has been
        # parsed, stored and marked PARSED. Asserting on the sentinel checks what actually matters:
        # that the worker reached the end of its drain. A crash before that point leaves no sentinel
        # and still fails the job.
        run: |
          set -o pipefail
          set +e
          node src/workers/pull-worker.js 2>&1 | tee run.log
          set -e
          if ! grep -q 'PULL_WORKER_COMPLETE' run.log; then
            echo "::error::worker did not reach completion - see log above"
            exit 1
          fi
          grep 'PULL_WORKER_COMPLETE' run.log
